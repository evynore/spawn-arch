source = ~/.config/hypr/theme/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    color = $page
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    placeholder_text = <i>Unlock</i>
    position = 0, -36
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 44
    position = 0, 80
    halign = center
    valign = center
}
